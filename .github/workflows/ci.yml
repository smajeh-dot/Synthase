# Checks every PR and every push to main on Windows. The ruleset requires the
# `ci` check, so a red result blocks the merge. Design: docs/decisions/0006.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e

jobs:
  ci:
    # Two checks: `ci` on 64-bit Intel/AMD Windows and `ci-arm64` on ARM64
    # Windows, the owner's laptop (decision 0020). The ruleset requires `ci`.
    # Lint, hooks and gitleaks run in `ci` only, since they don't depend on
    # the processor.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ci
            runner: windows-latest
            arch: x64
          - check: ci-arm64
            runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Full history, so gitleaks can scan a range of commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 3.13 is pinned in pyproject.toml (decision 0002).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        if: matrix.check == 'ci'
        run: ruff check .

      - name: ruff format --check
        if: matrix.check == 'ci'
        run: ruff format --check .

      # The hooks' installs, reused until the hook versions or Python change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.check == 'ci'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The session's hooks, on the files the new commits change (the same range
      # as gitleaks below). gitleaks is skipped here because the step below runs
      # a pinned, checksum-checked copy. Design: docs/decisions/0013.
      - name: pre-commit (changed files only)
        if: matrix.check == 'ci'
        env:
          SKIP: gitleaks
          FROM_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          pre-commit run --from-ref $env:FROM_REF --to-ref $env:TO_REF --show-diff-on-failure --color always
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pytest
        run: python -m pytest

      # "Install the project" put a synthase.exe in the job's own Python. On
      # ARM64 runners that Python is on the machine PATH, so a new window would
      # run it instead of the shim, and the setup script rightly refuses that.
      - name: Remove the job's own synthase
        run: python -m pip uninstall --yes synthase-lab

      # Runs the setup script as the owner does, twice to check it's safe to
      # re-run. Design: docs/decisions/0011 and 0020.
      - name: setup script
        run: |
          .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A new window gets its PATH from the registry only, so this step starts
      # from that, without the Python this job installed.
      - name: synthase works from a new window's PATH
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'Synthase\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $count = @($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $bin }).Count
          if ($count -ne 1) { throw "The user PATH holds $bin $count times, not once: $userPath" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $userPath
          $app = (Get-Command synthase).Source
          if ($app -ne (Join-Path $bin 'synthase.cmd')) { throw "synthase resolved to $app" }
          if (Get-Command syn -ErrorAction SilentlyContinue) { throw 'the retired syn command is still on the PATH' }
          synthase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Scans only the new commits: the PR's own commits, or the commits just
      # pushed to main. Older history was scanned when it was new.
      - name: gitleaks (new commits only)
        if: matrix.check == 'ci'
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          $name = "gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip"
          $zip = "$env:RUNNER_TEMP\$name"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v${env:GITLEAKS_VERSION}/$name" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:GITLEAKS_SHA256) { throw "gitleaks download checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\gitleaks"
          Write-Host "Scanning commits $env:RANGE"
          & "$env:RUNNER_TEMP\gitleaks\gitleaks.exe" git --log-opts="$env:RANGE" --redact --verbose --exit-code 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
