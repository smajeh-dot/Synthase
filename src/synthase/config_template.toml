# Synthase config TEMPLATE. Every value below is a PLACEHOLDER, not a checked value.
#
# `syn init` copies this file into your workspace as config.toml. Check each
# value there against the literature, then:
#   - set `value` to the checked value
#   - put the reference in `source`
#   - set `verified = true`
# Never put checked values in this template: it is public, in the code repo.
#
# Every entry has exactly these fields (see docs/decisions/0008-config-format.md):
#   name      plain-language label, used in warnings
#   value     a number, a text value, a range [low, high], or a list of bands
#   unit      the unit, or "" if there is none
#   source    where the value comes from
#   verified  true only once the value has been checked against the source
# Any result that uses an unverified value prints a warning.

# --- MIC (minimum inhibitory concentration) ---

[mic.growth_threshold]
name = "growth threshold"
value = 0.1
unit = "OD600"
source = "UNVERIFIED placeholder: check against the literature"
verified = false

# --- FICI (fractional inhibitory concentration index) ---
# Each band covers values up to and including its `max`. The last band has no
# `max` and covers everything above.

[fici.bands]
name = "FICI interpretation"
value = [
    { max = 0.5, label = "synergy" },
    { max = 4.0, label = "no interaction" },
    { label = "antagonism" },
]
unit = ""
source = "UNVERIFIED placeholder: check against the literature"
verified = false

# --- DMSO ---
# The highest final concentration of DMSO allowed in a well.

[dmso.limit]
name = "DMSO limit"
value = 1.0
unit = "% v/v"
source = "UNVERIFIED placeholder: check against the literature"
verified = false

# --- Melting point ---
# The widest melting range a pure sample should have.

[melting_point.purity_range]
name = "melting-point purity rule"
value = 2.0
unit = "°C"
source = "UNVERIFIED placeholder: check against the literature"
verified = false

