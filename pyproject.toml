[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthase-lab"
version = "0.0.0"
description = "Deterministic, offline lab calculations and data analysis from the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["rdkit>=2026.9.1"]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff"]

[project.scripts]
syn = "synthase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
