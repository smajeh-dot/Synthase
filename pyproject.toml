[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthase-lab"
version = "0.2.0"
description = "A lab databank and saved curve fits, in a full-screen app in PowerShell."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["textual==8.2.8", "tomlkit==0.15.2"]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff"]

[project.scripts]
synthase = "synthase.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
