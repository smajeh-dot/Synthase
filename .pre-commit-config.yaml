# Checks staged files inside the Claude session, before a commit is made. CI
# runs these hooks again on each PR's changed files. Design: docs/decisions/0007
# and 0013.
# Versions are pinned to release tags. gitleaks matches the version in ci.yml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Rule zero: no file over 1 MB. --enforce-all checks every file it is
      # given, not only newly staged ones, so it also works in CI (decision 0013).
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: trailing-whitespace
        # Keep Markdown's two-space line breaks.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
